# NixOS host: the container engine (podman) is provided declaratively by the
# server's NixOS configuration, not installed here. Ansible drives podman
# through the containers.podman collection, which shells out to the `podman`
# CLI on the host, so no Docker socket or Python SDK is required. Enable podman
# on the server with:
#
#   virtualisation.podman.enable = true;
#   virtualisation.podman.defaultNetwork.settings.dns_enabled = true;
#
# This role just verifies the podman engine is reachable before the other roles
# start containers, so a missing/misconfigured engine fails fast with a clear
# message.
- name: Verify the podman engine is reachable
  ansible.builtin.command: podman info
  changed_when: false
