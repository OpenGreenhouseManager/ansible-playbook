- name: Ensure Loki config directory exists
  file:
    path: "{{ loki_host_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Deploy Loki config
  template:
    src: loki-config.yml.j2
    dest: "{{ loki_host_config_dir }}/{{ loki_config_file }}"
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Ensure podman volume for Loki data
  containers.podman.podman_volume:
    name: loki_data

- name: Start Loki container
  containers.podman.podman_container:
    name: "{{ loki_container_name }}"
    image: "{{ loki_image }}"
    restart_policy: always
    publish:
      - "{{ loki_port }}:3100"
    volumes:
      - loki_data:/loki
      - "{{ loki_host_config_dir }}/{{ loki_config_file }}:/etc/loki/local-config.yaml"
    command: -config.file=/etc/loki/local-config.yaml
    state: started

- name: Wait for Loki to be ready
  uri:
    url: "{{ loki_health_check }}"
    method: GET
    status_code: 200
  register: loki_ready
  until: loki_ready.status == 200
  retries: 8
  delay: 5
