# node_exporter runs as a podman container on the NixOS host, consistent with
# the other services in this playbook. Running with the host network and PID
# namespace plus the host root mounted read-only (via --path.rootfs) makes it
# report real host metrics rather than the container's.
#
# The previous native install (package + systemd unit + cron) was removed: it
# does not work on a declarative NixOS host. The SMART disk-temperature metric
# was dropped along with it, since smartctl needs smartmontools and host device
# access that don't fit the container model. Add it declaratively in the host's
# NixOS config if it is needed again.
- name: Start Node Exporter container
  containers.podman.podman_container:
    name: node_exporter
    image: "quay.io/prometheus/node-exporter:v{{ node_exporter_version }}"
    restart_policy: always
    network: host
    pid: host
    volumes:
      - "/:/host:ro,rslave"
    command: "--path.rootfs=/host"
    state: started

- name: Wait for Node Exporter to be available
  ansible.builtin.uri:
    url: "http://{{ node_exporter_url }}/metrics"
    method: GET
    status_code: 200
  register: node_exporter_ready
  until: node_exporter_ready.status == 200
  retries: 8
  delay: 5
