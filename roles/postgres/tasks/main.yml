- name: Create a podman volume for PostgreSQL data
  containers.podman.podman_volume:
    name: "{{ postgres_docker_volume }}"
  become: true

- name: Start PostgreSQL container
  containers.podman.podman_container:
    name: postgres
    image: "{{ postgres_docker_image }}"
    restart_policy: unless-stopped
    env:
      POSTGRES_USER: "{{ postgres_user }}"
      POSTGRES_PASSWORD: "{{ postgres_password }}"
      POSTGRES_DB: "{{ postgres_main_db }}"
    publish:
      - "{{ postgres_port }}:5432"
    volumes:
      - "{{ postgres_docker_volume }}:/var/lib/postgresql/data"
  become: true

- name: Wait for PostgreSQL to be available
  wait_for:
    host: "127.0.0.1"
    port: "{{ postgres_port }}"
    delay: 5
    timeout: 30

- name: Create PostgreSQL databases if they don't exist
  shell: >
    podman exec postgres psql -U admin -d auth -tAc
    "SELECT 'CREATE DATABASE {{ item }}' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = '{{ item }}')" |
    podman exec -i postgres psql -U admin -d auth
  loop: "{{ postgres_extra_dbs }}"
  changed_when: false
